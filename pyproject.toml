[project]
name = "nonebot-plugin-awmc-arcade"
version = "0.3.0"
description = "awmc-helper 生态第三方插件：舞萌DX 机厅人数上报、附近机厅查找、线上排卡、Nearcade 云同步（替代主插件内置 awmc.arcade）"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "shinyashen", email = "shinyashen@qq.com" }]
keywords = ["nonebot", "maimai", "maimaidx", "舞萌DX", "arcade", "排卡", "nearcade", "awmc"]
license = { text = "MIT" }
dependencies = [
  "aiosqlite>=0.19.0",                       # 统一 SQLite 异步驱动
  "httpx>=0.27.0,<1.0.0",                    # Nearcade API（全异步，不引入 aiohttp）
  "nonebot-adapter-onebot>=2.4.6,<3.0.0",    # 本插件为 OneBot v11 专插（位置监听解析 CQ json）
  "nonebot-plugin-apscheduler>=0.5.0,<1.0.0",# 每日 0 点清零
  "nonebot-plugin-awmc-helper>=0.1.0",       # 主插件：core 公开接口（HTTP 智能代理/异常兜底/合并转发）
  "nonebot-plugin-localstore>=0.7.4,<1.0.0", # 存储文件
  "nonebot2>=2.4.3,<3.0.0",
  "sqlmodel>=0.0.16",                        # 统一 SQLite ORM
]

[project.urls]
Homepage = "https://github.com/shinyashen/nonebot-plugin-awmc-arcade"
Issues = "https://github.com/shinyashen/nonebot-plugin-awmc-arcade/issues"
Repository = "https://github.com/shinyashen/nonebot-plugin-awmc-arcade.git"

[dependency-groups]
dev = [
  "nonebot2[fastapi]>=2.4.2,<3.0.0",
  "poethepoet>=0.36.0",
  "ruff>=0.15.2,<1.0.0",
  { include-group = "test" },
]
test = [
  "nonebot-adapter-onebot>=2.4.6,<3.0.0",
  "nonebot2[fastapi]>=2.4.2,<3.0.0",
  "nonebug>=0.3.7,<1.0.0",
  "pytest-asyncio>=1.3.0,<1.4.0",
  "pytest-cov>=7.0.0",
  "pytest-xdist>=3.8.0,<4.0.0",
  "respx>=0.22.0", # Nearcade HTTP mock
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
# 主插件仓库暂为私有且未上架 PyPI：开发环境以平级目录 path 依赖解析。
# 作为 awmc_plugins/ 目录插件部署时由主插件直接加载，不走此解析；
# 主插件公开/上架后删除本段即回到 `nonebot-plugin-awmc-helper>=0.1.0` 版本依赖。
nonebot-plugin-awmc-helper = { path = "../nonebot-plugin-awmc-helper" }

[tool.nonebot]
adapters = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]
plugins = ["nonebot_plugin_awmc_arcade"]

[tool.poe.tasks]
test = "pytest --cov=src --cov-report xml --junitxml=./junit.xml -n auto"

[tool.coverage.report]
exclude_lines = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError:",
]

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
defineConstant = { PYDANTIC_V2 = true }
exclude = ["**/.venv", "**/data", "**/cache", "**/__pycache__"]
executionEnvironments = [
  { root = "./tests", extraPaths = ["./src"] },
  { root = "./src" },
]
typeCheckingMode = "standard"
disableBytesTypePromotions = true

[tool.pytest.ini_options]
addopts = [
  "--import-mode=prepend", # 导入模式
  "--strict-markers",      # 严格标记模式
  "--tb=short",            # 简短的错误回溯
  "-ra",                   # 显示所有测试结果摘要
  "-s",                    # 显示打印信息
  "-v",                    # 详细输出
]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 88

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "I",     # isort
  "UP",    # pyupgrade
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "TID",   # flake8-tidy-imports
  "RUF",   # Ruff-specific rules
]
ignore = [
  "E402",   # module-import-not-at-top-of-file
  "UP037",  # quoted-annotation
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "W191",   # indentation contains tabs
  "TID252", # relative-import
]

[tool.ruff.lint.isort]
length-sort = true
known-first-party = ["tests/*"]
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
